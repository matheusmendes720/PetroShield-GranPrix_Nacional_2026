[project]
name = "petroshield-axeguard"
version = "1.0.0"
description = "AxeGuard Agentic SOC Prototype - SENAI Grand Prix Nacional 2026"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.1",
    "pydantic>=2.13.0,<3",
    "pydantic-core>=2.27.0",
    "httpx>=0.27.0",
    "rich>=13.7.1",
    "textual>=0.89.1",
    "python-dotenv>=1.0.1",
    "openai>=1.30.0",
    "sse-starlette>=2.0.0",
    "exceptiongroup>=1.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []
